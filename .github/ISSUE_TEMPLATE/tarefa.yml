name: Tarefa de desenvolvimento
description: Registrar objetivo, responsabilidade e critérios de conclusão.
title: '[DZ-NN] '
body:
  - type: dropdown
    id: setor
    attributes:
      label: Setor
      options:
        - Frontend
        - Backend
        - Documentação
        - Testes
        - Organização
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qual comportamento deve existir quando a tarefa terminar?
    validations:
      required: true
  - type: input
    id: responsavel
    attributes:
      label: Responsável
      description: Informe o usuário do GitHub e selecione-o também em Assignees.
      placeholder: '@usuario'
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Use critérios observáveis e verificáveis.
      value: |
        - [ ] Comportamento principal implementado.
        - [ ] Estados de erro e carregamento tratados.
        - [ ] Validação relevante concluída.
        - [ ] Documentação atualizada.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência de validação
      description: Descreva teste realizado, resultado e eventuais pendências antes de mover para Concluído.
